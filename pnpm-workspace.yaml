# Until @jgrieve/forms is published, resolve it from the sibling checkout. `file:` installs a
# copy whose peers (react, zod, ...) resolve from this package, so there is one React and one
# zod; `link:` would not. Remove once published.
overrides:
  '@jgrieve/forms': file:../dynamic-form

allowBuilds:
  esbuild: true
  unrs-resolver: true
