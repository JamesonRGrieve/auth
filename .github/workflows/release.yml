name: Release

# A `v*` tag publishes this package to npm through the shared gated workflow
# (JamesonRGrieve/Workflows publish-ts-npm-gated.yml): pack, audit and a clean-install smoke
# test, then the publish waits for the `npm` environment's required reviewer. It publishes with
# npm trusted publishing (OIDC), whose trusted publisher names this file and that environment;
# no token is stored. pnpm is package.json's packageManager.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    uses: JamesonRGrieve/Workflows/.github/workflows/publish-ts-npm-gated.yml@d91b690a63a761d4c1a5d40138766a228302d531
    with:
      tools-ref: d91b690a63a761d4c1a5d40138766a228302d531
    permissions:
      contents: write
      id-token: write
